<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Plano Viajante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/assinante.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/assinante-minha-assinatura.css">
</head>

<body>

    <div id="header"></div>

    <main class="plano-page">
        <div class="container">
            <a href="/" class="back-button" aria-label="Voltar para a página inicial">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <h1 class="titulo">Obrigado por assinar o Plano Viajante!</h1>

            <div class="conteudo">
                <div>
                    <div class="card">
                        <div class="card-header">Seu Plano</div>
                        <div class="card-body">
                            <div class="valor">R$ 9,99 / mês</div>
                            <div class="linha"></div>
                            <div class="subtitulo">Próximo pagamento</div>
                            <p class="texto">O valor de R$9,99 deve ser pago até a data: 01/01/2027</p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">Pagamentos</div>
                        <div class="card-body">
                            <div class="pagamento">
                                <div>
                                    <strong>Forma de pagamento</strong><br>
                                    V****0101
                                </div>
                                <div>
                                    <a href="#" style="color:#70AE6E;font-weight:700;text-decoration:none;">Cancelar assinatura</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="botoes">
                        <button class="btn" onclick="window.location.href='/assinante/roteiros-ia'">Criar roteiro</button>
                        <button class="btn" onclick="window.location.href='/assinante/meus-roteiros'">Seus Roteiros</button>
                        <button class="btn" onclick="window.location.href='/assinante/aumentar-catalogo'">Aumentar Catálogo</button>
                    </div>
                </div>

                <div class="galeria">
                    <div class="coluna-unica">
                        <div class="imagem">
                            <img src="/static/img/minha-assinatura/img1.webp" alt="Cataratas">
                        </div>
                    </div>

                    <div class="coluna">
                        <div class="imagem">
                            <img src="/static/img/minha-assinatura/img2.webp" alt="Cristo Redentor">
                        </div>
                        <div class="imagem">
                            <img src="/static/img/minha-assinatura/img3.webp" alt="Beto Carrero">
                        </div>
                    </div>

                    <div class="coluna">
                        <div class="imagem">
                            <img src="/static/img/minha-assinatura/img4.webp" alt="Praia">
                        </div>
                        <div class="imagem">
                            <img src="/static/img/minha-assinatura/img5.webp" alt="Gramado">
                        </div>
                        <div class="imagem">
                            <img src="/static/img/minha-assinatura/img6.webp" alt="Pelourinho">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/assinante-minha-assinatura.js"></script>
</body>
</html>
