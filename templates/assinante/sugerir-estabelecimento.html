<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Sugerir Local</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/assinante.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/assinante-sugerir-estabelecimento.css">
</head>

<body>

    <div id="header"></div>

    <div id="successToast" class="custom-toast">
        <i class="fa-solid fa-circle-check" style="color: #70AE6E; font-size: 1.4rem;"></i>
        <span>Sugestão enviada com sucesso! Obrigado por colaborar.</span>
    </div>

    <main class="hero">
        <div class="container d-flex justify-content-center">

            <div class="profile-card">

                <button class="btn-back" onclick="window.history.back()" title="Voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <div class="welcome-text">
                    Olá <strong>Viajante</strong>, querendo sugerir um novo estabelecimento?<br>
                    <span class="highlight-title">CONTE PARA NÓS!!</span>
                </div>

                <div class="form-box-container">
                    <div class="form-box-header">
                        Sugerir Estabelecimento
                    </div>

                    <div class="form-box-body">
                        <form id="suggestionForm" method="post" action="/assinante/sugerir-estabelecimento">
                            <div class="row g-4">

                                <div class="col-md-6">
                                    <label class="form-label-custom" for="nome_local">Nome do Local:</label>
                                    <input type="text" name="nome_local" class="form-control-custom w-100" required placeholder="Ex: Praia do Forno" id="nome_local">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label-custom" for="categoria">Categoria:</label>
                                    <select name="categoria" class="form-control-custom w-100" required id="categoria">
                                        <option value="" disabled selected>Selecione uma opção</option>

                                        <option value="restaurante">Restaurante / Alimentação</option>
                                        <option value="hotel">Hospedagem / Hotelaria</option>
                                        <option value="outro">Outro</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label-custom" for="estado">Estado (UF):</label>
                                    <input type="text" name="estado" class="form-control-custom w-100" required placeholder="Ex: RJ" id="estado">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label-custom" for="cidade">Cidade:</label>
                                    <input type="text" name="cidade" class="form-control-custom w-100" required placeholder="Ex: Arraial do Cabo" id="cidade">
                                </div>

                                <div class="col-12">
                                    <label class="form-label-custom" for="descricao">Descrição / Justificativa:</label>
                                    <textarea name="descricao" class="form-control-custom w-100" rows="3" required placeholder="Conte-nos um pouco sobre este local e por que ele deve estar na TripBrasil..." id="descricao"></textarea>
                                </div>

                                <div class="col-12 text-end mt-4">
                                    <button type="submit" class="btn-submit-custom">
                                        <i class="fa-solid fa-paper-plane"></i>
                                        <span>Enviar Sugestão</span>
                                    </button>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/assinante-sugerir-estabelecimento.js"></script>
</body>
</html>
