<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Meu Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-perfil-usuario.css">
</head>

<body>

    <div id="header"></div>

    <main class="hero">
        <div class="container d-flex justify-content-center">

            <div class="profile-card">

                <button class="btn-back" onclick="window.history.back()" title="Voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <div class="profile-avatar-container">
                    <img src="/static/img/mariana.webp" alt="Mariana Silva" class="profile-avatar" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=200'">
                </div>

                <div class="profile-greeting">
                    Olá, Mariana Silva!
                </div>

                <div class="profile-grid">

                    <a href="/redefinir-senha" class="btn-profile-action">
                        <i class="fa-solid fa-lock"></i>
                        <span>Alterar Senha</span>
                    </a>

                    <a href="/conta/editar-perfil" class="btn-profile-action">
                        <i class="fa-solid fa-user-pen"></i>
                        <span>Editar informações</span>
                    </a>

                    <a href="#" class="btn-profile-action btn-danger-custom">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Excluir conta</span>
                    </a>

                    <a href="/conta/favoritos" class="btn-profile-action btn-danger-custom">
                        <i class="fa-solid fa-heart"></i>
                        <span>Favoritos</span>
                    </a>

                    <a href="/assinante/meus-roteiros" class="btn-profile-action">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <span>Meus roteiros</span>
                    </a>

                    <a href="/conta/minhas-avaliacoes" class="btn-profile-action">
                        <i class="fa-solid fa-star"></i>
                        <span>Minhas avaliações</span>
                    </a>

                </div>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/cadastrado-perfil-usuario.js"></script>
</body>
</html>
