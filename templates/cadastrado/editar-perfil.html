<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Editar Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-editar-perfil.css">
</head>

<body>

    <div id="header"></div>

    <div id="successToast" class="custom-toast">
        <i class="fa-solid fa-circle-check" style="color: #70AE6E; font-size: 1.4rem;"></i>
        <span>Alterações salvas com sucesso!</span>
    </div>

    <main class="hero">
        <div class="container d-flex justify-content-center">

            <div class="profile-card">

                <button class="btn-back" onclick="window.history.back()" title="Voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <div class="page-badge">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>Editar dados</span>
                </div>

                <form id="editProfileForm" method="post" action="/conta/editar-perfil">
                    <div class="row align-items-center">

                        <div class="col-lg-6">
                            <div class="row g-4">
                                <div class="col-12">
                                    <label class="form-label-custom" for="nome">Nome:</label>
                                    <!-- value= fixo: vira variavel de contexto quando houver banco -->
                                    <input type="text" name="nome" class="form-control-custom" value="Mariana Silva" required id="nome">
                                </div>

                                <div class="col-12">
                                    <label class="form-label-custom" for="email">Email:</label>
                                    <input type="email" name="email" class="form-control-custom" value="marianamssilva02@gmail.com" required id="email">
                                </div>

                                <div class="col-12">
                                    <label class="form-label-custom" for="celular">Celular:</label>
                                    <input type="tel" name="celular" class="form-control-custom" value="(27) 999356709" id="celular">
                                </div>

                                <div class="col-6">
                                    <label class="form-label-custom" for="estado">Estado:</label>
                                    <input type="text" name="estado" class="form-control-custom" value="ES" id="estado">
                                </div>

                                <div class="col-6">
                                    <label class="form-label-custom" for="cidade">Cidade:</label>
                                    <input type="text" name="cidade" class="form-control-custom" value="Vitória" id="cidade">
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="avatar-section">
                                <img src="/static/img/mariana.webp" alt="Mariana Silva" class="profile-avatar" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400'">
                            </div>
                        </div>

                        <div class="col-12 text-start mt-4">
                            <button type="submit" class="btn-save-custom">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Salvar alterações</span>
                            </button>
                        </div>

                    </div>
                </form>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/cadastrado-editar-perfil.js"></script>
</body>
</html>
