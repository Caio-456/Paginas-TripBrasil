<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Avaliar Experiência</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-avaliar-estabelecimento.css">
</head>

<body>

    <div id="header"></div>

    <main class="hero">
        <div class="container">

            <div class="main-content">
                <button class="btn-back" onclick="window.history.back()" aria-label="Voltar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
                    </svg>
                </button>

                <div class="review-header">
                    <h1>Avalie Sua Experiência</h1>
                    <p> Feira de Pedra Sabão</p>
                </div>

                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgGKyOUYuZz1FWRep3ifY6X-V5TCoJAkuzUeRTA9DOMGcWES0BPqatELy1DYxVMf96OMWgpTvmNxOVRA52xI-Gos2SJVKrwhSvcAosfb9RZzMj-UihU1qiqp7VX9hWZNJDstdoRssQOQzGO/s1600/Feira+de+Artesanato+do+Largo+do+Coimbra+%25282%2529.jpg" alt="Feira de Sabão" class="place-banner">

                <form method="post" action="/conta/avaliar-estabelecimento">
                    <div class="mb-4">
                        <label for="comentario">Compartilhe detalhes da sua visita</label>
                        <textarea name="comentario" class="custom-textarea" rows="4" placeholder="Digite aqui..." id="comentario"></textarea>
                    </div>

                    <div class="mb-4">
                        <label>Nota</label>
                        <div class="star-rating">
                            <span>☆</span><span>☆</span><span>☆</span><span>☆</span><span>☆</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label>Adicione foto da sua visita</label>
                        <div class="upload-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-camera mb-2" viewBox="0 0 16 16" style="opacity: 0.6;">
                                <path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1v6zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2z"/>
                                <path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z"/>
                            </svg>
                            <p style="margin:0; font-size: 0.9rem; opacity: 0.7;">Insira sua imagem aqui</p>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit-review">Enviar Avaliação</button>
                </form>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/cadastrado-avaliar-estabelecimento.js"></script>
</body>

</html>
