<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Explorar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/publico.css">
  <link rel="stylesheet" href="/static/css/pages/publico-header.css">
  <link rel="stylesheet" href="/static/css/pages/publico-buscar-explorar.css">
</head>

<body>

    <div id="header"></div>

    <main class="explorar">

        <div class="container">
            <a href="/" class="back-button" aria-label="Voltar para a página inicial">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <h1 class="titulo">Explorar</h1>

            <div class="categorias">
                <button class="categoria ativo">Tudo</button>
                <button class="categoria">Pontos Turísticos</button>
                <button class="categoria">Estabelecimentos</button>
                <button class="categoria" onclick="window.location.href='/roteiros-predefinidos'">Roteiros</button>
            </div>

            <form class="filtros" method="get" action="/resultados-pesquisa">

                <select name="ordenar" aria-label="Ordenar resultados">
                    <option value="recente">Mais recente</option>
                    <option value="popular">Mais popular</option>
                    <option value="a-z">A-Z</option>
                </select>

                <input type="text" name="q" class="pesquisa" placeholder="Pesquisar..." aria-label="Pesquisar destinos">

            </form>

            <div class="cards">

                <!-- repeticao: 8 cards iguais, candidato a {% for %} -->
                <div class="card">
                    <a href="/ponto-turistico"><img src="/static/img/buscar-explorar/e1.webp" alt="Pão de Açúcar, RJ"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar Pão de Açúcar, RJ">♡</span>
                        <h2>Pão de Açúcar, RJ</h2>
                        <p>Ponto Turístico</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/ponto-turistico"><img src="/static/img/buscar-explorar/e2.webp" alt="Beto Carrero, SC"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar Beto Carrero, SC">♡</span>
                        <h2>Beto Carrero, SC</h2>
                        <p>Ponto Turístico</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/roteiro"><img src="/static/img/buscar-explorar/e3.webp" alt="10 dias em Gramado"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar 10 dias em Gramado">♡</span>
                        <h2>10 dias em Gramado</h2>
                        <p>Roteiro</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/estabelecimento"><img src="/static/img/buscar-explorar/e4.webp" alt="Terraço Itália, SP"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar Terraço Itália, SP">♡</span>
                        <h2>Terraço Itália, SP</h2>
                        <p>Estabelecimento</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/roteiro"><img src="/static/img/buscar-explorar/e5.webp" alt="8 dias em Natal"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar 8 dias em Natal">♡</span>
                        <h2>8 dias em Natal</h2>
                        <p>Roteiro</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/estabelecimento"><img src="/static/img/buscar-explorar/e6.webp" alt="Coco Bambu, CE"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar Coco Bambu, CE">♡</span>
                        <h2>Coco Bambu, CE</h2>
                        <p>Estabelecimento</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/ponto-turistico"><img src="/static/img/buscar-explorar/e7.webp" alt="Parque Ibirapuera, SP"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar Parque Ibirapuera, SP">♡</span>
                        <h2>Parque Ibirapuera, SP</h2>
                        <p>Ponto Turístico</p>
                    </div>
                </div>

                <div class="card">
                    <a href="/roteiro"><img src="/static/img/buscar-explorar/e8.webp" alt="5 dias em Salvador"></a>
                    <div class="card-content">
                        <span class="favorito" role="button" tabindex="0" aria-pressed="false" aria-label="Favoritar 5 dias em Salvador">♡</span>
                        <h2>5 dias em Salvador</h2>
                        <p>Roteiro</p>
                    </div>
                </div>

            </div>

        </div>

    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/publico-buscar-explorar.js"></script>
</body>

</html>
