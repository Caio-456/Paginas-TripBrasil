<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Recuperar Senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/publico.css">
  <link rel="stylesheet" href="/static/css/pages/publico-header.css">
  <link rel="stylesheet" href="/static/css/pages/publico-recuperar-senha.css">
</head>

<body>

    <div id="header"></div>

    <main class="hero">
        <div class="container d-flex justify-content-center">

            <div class="content-container" style="max-width: 500px;">

                <section class="password-card">

                    <button class="btn-back" onclick="window.history.back()" aria-label="Voltar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-arrow-left-short" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
                        </svg>
                    </button>

                    <h1>Recuperar Senha</h1>
                    <p>Digite seu e-mail para receber o link de redefinição.</p>

                    <form method="post" action="/recuperar-senha">

                        <div class="input-group-custom">
                            <input type="email" name="email" placeholder="E-mail Cadastrado" required aria-label="E-mail cadastrado">
                        </div>

                        <button type="submit" class="btn-submit" onclick="window.location.href='/redefinir-senha'">
                            Enviar Link
                        </button>

                    </form>
                </section>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/publico-recuperar-senha.js"></script>
</body>

</html>

</body>
</html>
