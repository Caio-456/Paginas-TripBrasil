<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Torne-se Anunciante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/publico.css">
  <link rel="stylesheet" href="/static/css/pages/publico-header.css">
  <link rel="stylesheet" href="/static/css/pages/publico-tornar-se-anunciante.css">
</head>

<body>

    <div id="header"></div>

    <div id="successToast" class="custom-toast">
        <i class="fa-solid fa-clock-rotate-left" style="color: #70AE6E; font-size: 1.4rem;"></i>
        <span>Solicitação enviada! Aguarde a análise da nossa equipe.</span>
    </div>

    <main class="hero">
        <div class="container d-flex justify-content-center align-items-center">

            <div class="advertiser-card">

                <button class="btn-back" onclick="window.history.back()" title="Voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <h1 class="main-title">Torne-se anunciante</h1>

                <form id="advertiserForm" method="post" action="/tornar-se-anunciante">

                    <div class="info-block">
                        <div class="info-block-title">Informações Básicas</div>

                        <div class="row g-4">
                            <div class="col-12">
                                <label class="form-label-custom" for="nome_completo">Nome completo</label>
                                <input type="text" name="nome_completo" class="form-control-custom" required placeholder="Digite seu nome completo" id="nome_completo">
                            </div>

                            <div class="col-12">
                                <label class="form-label-custom" for="cnpjInput">CNPJ</label>
                                <input type="text" name="cnpj" inputmode="numeric" class="form-control-custom" required placeholder="00.000.000/0001-00" id="cnpjInput">
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn-submit-dark">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>Aguardar aprovação</span>
                        </button>
                    </div>

                </form>

                <svg class="bags-illustration" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="40" y="35" width="45" height="50" rx="6" fill="#70AE6E" fill-opacity="0.3" stroke="#70AE6E" stroke-width="2.5"/>
                    <path d="M52 35V25C52 22.8 53.8 21 56 21H69C71.2 21 73 22.8 73 25V35" stroke="#70AE6E" stroke-width="2.5" stroke-linecap="round"/>
                    <rect x="40" y="55" width="45" height="6" fill="#70AE6E" fill-opacity="0.5"/>

                    <rect x="15" y="48" width="40" height="38" rx="6" fill="#1f3d52" fill-opacity="0.4" stroke="white" stroke-width="2.5"/>
                    <path d="M27 48V40C27 38.3 28.3 37 30 37H40C41.7 37 43 38.3 43 40V48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <rect x="25" y="48" width="5" height="38" fill="rgba(255,255,255,0.15)"/>
                    <rect x="40" y="48" width="5" height="38" fill="rgba(255,255,255,0.15)"/>
                    <circle cx="20" cy="86" r="4" fill="white"/>
                    <circle cx="50" cy="86" r="4" fill="white"/>
                </svg>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/publico-tornar-se-anunciante.js"></script>
</body>
</html>
