<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/publico.css">
  <link rel="stylesheet" href="/static/css/pages/publico-header.css">
  <link rel="stylesheet" href="/static/css/pages/publico-cadastro.css">
</head>

<body>

    <div id="header"></div>

    <div id="toastMessage" class="toast-notification">
        <span class="check-icon">✓</span> Alterações salvas com sucesso!
    </div>

    <main class="hero">

        <div class="cadastro-wrapper">

            <div class="cadastro-card">

                <a href="/" class="back-button">
                    <img src="/static/img/seta.svg" alt="voltar" class="icon" width="30" height="30">
                </a>

                <div class="cadastro-grid">

                    <form class="form-box" id="cadastroForm" method="post" action="/cadastro" onsubmit="salvarAlteracoes(event)">

                        <h2>Junte-se ao TripBrasil</h2>

                        <p>
                            Planeje viagens, descubra destinos incríveis
                            e conecte-se com experiências autênticas em
                            todo o Brasil.
                        </p>

                        <label for="nome_completo">Nome completo</label>
                        <input type="text" name="nome_completo" placeholder="Digite seu nome" required id="nome_completo">

                        <label for="usuario">Nome de usuário</label>
                        <input type="text" name="usuario" placeholder="Escolha um nome de usuário" required id="usuario">

                        <label for="email">E-mail:</label>
                        <input type="email" name="email" placeholder="seuemail@exemplo.com" required id="email">

                        <label for="senha">Senha:</label>
                        <input type="password" name="senha" placeholder="Crie uma senha" required id="senha">

                        <label for="confirmar_senha">Confirmar senha:</label>
                        <input type="password" name="confirmar_senha" placeholder="Repita a senha" required id="confirmar_senha">

                        <button type="submit" class="btn-salvar">
                            Criar conta
                        </button>

                        <p class="login-link">
                            Já possui uma conta?
                            <a href="/login">Entrar</a>
                        </p>

                    </form>

                    <div class="img-grid">
                        <img src="/static/img/cadastro/img1.webp" class="img-cima" alt="">
                        <img src="/static/img/cadastro/img2.webp" alt="">
                        <img src="/static/img/cadastro/img3.webp" alt="">
                        <img src="/static/img/cadastro/img4.webp" class="img-baixo" alt="">
                    </div>

                </div>

            </div>

        </div>
</main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/publico-cadastro.js"></script>
</body>
</html>
