<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/publico.css">
  <link rel="stylesheet" href="/static/css/pages/publico-header.css">
  <link rel="stylesheet" href="/static/css/pages/publico-login.css">
</head>

<body>
    <div id="header"></div>

    <main class="login-page">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-6 col-xl-5 d-flex justify-content-center">

                    <div class="login-card-wrapper">

                        <a href="/" class="back-button" aria-label="Voltar para a página inicial">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                        </a>

                        <div class="login-card">

                            <div class="title-group">
                                <h1>Bem-vindo de volta!</h1>
                            </div>

                            <p>
                                Continue sua jornada e descubra novos destinos pelo Brasil.
                            </p>

                            <form method="post" action="/login">
                                <div class="mb-3">
                                    <input type="email" name="email" class="form-control custom-input" placeholder="E-mail ou usuário" required aria-label="E-mail ou usuário">
                                </div>

                                <div class="mb-3">
                                    <input type="password" name="senha" class="form-control custom-input" placeholder="Senha" required aria-label="Senha">
                                </div>

                                <a href="/recuperar-senha" class="forgot-password">
                                    Esqueceu sua senha?
                                </a>

                                <button type="submit">
                                    Entrar
                                </button>
                            </form>

                            <div class="divider">
                                ou
                            </div>

                            <button class="google-button">
                                <img src="https://www.google.com/favicon.ico" alt="Google">
                                Continuar com Google
                            </button>

                            <div class="signup">
                                Não possui uma conta?
                                <a href="/cadastro">
                                    Cadastre-se
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>

    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/publico-login.js"></script>
</body>

</html>
