<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Editar Local (Admin)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/administrador.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-header-admin.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-admin-editar-local.css">
</head>
<body>

    <div id="header"></div>

    <main class="main-container">
        <h1 class="page-title">Painel Admin - <span>Editar Local</span></h1>
        <a href="/admin/dashboard" class="back-button" aria-label="Voltar para o painel">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <form id="formAdminEditar" method="post" action="/admin/editar-local" onsubmit="event.preventDefault(); openModal();">
            <div class="form-grid">

                <div class="column">
                    <section>
                        <h2 class="section-title"><i class="fa-solid fa-sliders"></i> Dados Gerais</h2>

                        <div class="input-group">
                            <label for="nome">Nome:</label>
                            <input type="text" name="nome" value="Patinhas" required id="nome">
                        </div>

                        <div class="input-group">
                            <label for="descricao">Descrição:</label>
                            <textarea name="descricao" required id="descricao">Sorveteria legal</textarea>
                        </div>

                        <label>Tipo:</label>
                        <div class="radio-container">
                            <label class="radio-option">
                                <input type="radio" name="tipo_local" value="estabelecimento" checked>
                                Estabelecimento
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="tipo_local" value="ponto-turistico">
                                Ponto turístico
                            </label>
                        </div>

                        <div class="status-box">
                            <label class="checkbox-option">
                                <input type="checkbox" name="anunciando" value="1" id="anunciando" checked>
                                <strong>Anunciando: [ X ]</strong>
                            </label>
                        </div>
                    </section>
                </div>

                <div class="column">
                    <section>
                        <h2 class="section-title"><i class="fa-solid fa-map-pin"></i> Localização e Fotos</h2>

                        <div class="input-group">
                            <label for="select-estado">Estado:</label>
                            <select name="estado" id="select-estado" required></select>
                        </div>

                        <div class="input-group">
                            <label for="select-cidade">Cidade:</label>
                            <select name="cidade" id="select-cidade" required disabled></select>
                        </div>

                        <label>Localização:</label>
                        <div class="map-placeholder">
                            <i class="fa-solid fa-earth-americas" style="font-size: 24px; margin-bottom: 8px; color: #e6c594;"></i>
                            Mapa carregado com coordenadas de Marataízes
                        </div>

                        <label>Fotos:</label>
                        <div class="media-grid">
                            <div class="upload-main">
                                <i class="fa-solid fa-plus" style="font-size: 24px; color: rgba(255,255,255,0.6);"></i>
                                <span style="font-size: 12px; margin-top: 5px;">Adicionar</span>
                            </div>
                            <div class="thumb-wrapper">
                                <i class="fa-regular fa-image" style="font-size: 20px; color: rgba(255,255,255,0.4)"></i>
                                <button type="button" class="btn-delete-thumb" aria-label="Remover imagem"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <div class="thumb-wrapper">
                                <i class="fa-regular fa-image" style="font-size: 20px; color: rgba(255,255,255,0.4)"></i>
                                <button type="button" class="btn-delete-thumb" aria-label="Remover imagem"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </section>
                </div>

            </div>

            <div class="footer-actions">
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-square-check"></i> Salvar
                </button>
            </div>
        </form>
    </main>

    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3>Alterações Salvas!</h3>
            <p>O local foi atualizado com sucesso na base de dados do sistema.</p>
            <button class="btn-modal-close" onclick="closeModal()">Ok</button>
        </div>
    </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/administrador-admin-editar-local.js"></script>
</body>
</html>
