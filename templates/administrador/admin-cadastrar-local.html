<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Cadastrar Local</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/administrador.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-header-admin.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-admin-cadastrar-local.css">
</head>

<body>

    <div id="header"></div>

    <main class="admin-hero">
        <div class="container">

            <div class="admin-panel-card">

                <button class="btn-back-admin" onclick="window.location.href='/admin/locais'" title="Voltar para a gestão" aria-label="Voltar para a gestão">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <h1 class="admin-section-title">Cadastro de Local</h1>

                <form method="post" action="/admin/cadastrar-local" onsubmit="handleSubmit(event)">
                    <div class="form-layout-grid">

                        <div class="left-form-column">

                            <div class="form-group-custom">
                                <label for="nomeLocal">Nome:</label>
                                <input type="text" name="nome" id="nomeLocal" class="form-control-custom" required placeholder="Digite o nome do local">
                            </div>

                            <div class="form-group-custom">
                                <label for="descLocal">Descrição:</label>
                                <textarea name="descricao" id="descLocal" class="form-control-custom" rows="3" required placeholder="Descreva os principais detalhes do local..."></textarea>
                            </div>

                            <div class="form-group-custom">
                                <label>Tipo:</label>
                                <div class="radio-inline-group">
                                    <label class="radio-item">
                                        <input type="radio" name="tipo_local" value="estabelecimento" checked> Estabelecimento
                                    </label>
                                    <label class="radio-item">
                                        <input type="radio" name="tipo_local" value="ponto-turistico"> Ponto turístico
                                    </label>
                                </div>
                            </div>

                            <div class="form-group-custom">
                                <label for="txtPreco">Preço de entrada:</label>
                                <div class="price-container">
                                    <label class="checkbox-item" for="chkGratuito">
                                        <input type="checkbox" name="gratuito" value="1" id="chkGratuito" checked onchange="togglePriceInput(this)"> Gratuito
                                    </label>
                                    <input type="number" step="0.01" min="0" name="preco" id="txtPreco" class="form-control-custom" style="max-width: 150px; display: none;" placeholder="Valor (R$)">
                                </div>
                            </div>

                            <div class="form-group-custom">
                                <label for="select-estado">Estado:</label>
                                <select name="estado" id="select-estado" class="form-control-custom" required>
                                    <option value="" disabled selected>Selecione um estado</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="MG">Minas Gerais</option>
                                </select>
                            </div>

                            <div class="form-group-custom">
                                <label for="select-cidade">Cidade:</label>
                                <select name="cidade" id="select-cidade" class="form-control-custom" required>
                                    <option value="" disabled selected>Selecione uma cidade</option>
                                    <option value="vitoria">Vitória</option>
                                    <option value="vila-velha">Vila Velha</option>
                                    <option value="rio-janeiro">Rio de Janeiro</option>
                                </select>
                            </div>

                        </div>

                        <div class="right-form-column">

                            <div class="map-section-title">Localização:</div>
                            <div class="map-wrapper-box">
                                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3741.8711812821217!2d-40.29410182390886!3d-20.305619150159424!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xb8167bcbe632bb%3A0x6bba847c234a413!2zVitDs3JpYSwgRVM!5e0!3m2!1spt-BR!2sbr!4v1719056000000!5m2!1spt-BR!2sbr" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                            </div>

                            <div class="photos-container-box">
                                <div class="photos-box-title">Fotos</div>

                                <div class="photos-grid-layout">
                                    <div class="main-upload-trigger" onclick="triggerUploadAlert()" role="button" tabindex="0" aria-label="Enviar foto principal">
                                        <i class="fa-solid fa-image-user"></i>
                                        <i class="fa-solid fa-circle-plus"></i>
                                        <span>Adicione a imagem aqui</span>
                                    </div>

                                    <div class="secondary-thumbnails-grid">
                                        <div class="thumb-upload-slot">
                                            <i class="fa-regular fa-image"></i>
                                            <button type="button" class="btn-delete-thumb" onclick="removeThumb(event, this)" aria-label="Remover imagem"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                        <div class="thumb-upload-slot">
                                            <i class="fa-regular fa-image"></i>
                                            <button type="button" class="btn-delete-thumb" onclick="removeThumb(event, this)" aria-label="Remover imagem"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                        <div class="thumb-upload-slot">
                                            <i class="fa-regular fa-image"></i>
                                            <button type="button" class="btn-delete-thumb" onclick="removeThumb(event, this)" aria-label="Remover imagem"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                        <div class="thumb-upload-slot">
                                            <i class="fa-regular fa-image"></i>
                                            <button type="button" class="btn-delete-thumb" onclick="removeThumb(event, this)" aria-label="Remover imagem"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="text-end">
                                <button type="submit" class="btn-submit-save">
                                    <span>Salvar</span>
                                </button>
                            </div>

                        </div>

                    </div>
                </form>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/administrador-admin-cadastrar-local.js"></script>
</body>

</html>
