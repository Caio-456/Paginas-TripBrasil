<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Gestão de Anúncios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/administrador.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-header-admin.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-admin-anuncios.css">
</head>

<body>

    <div id="header"></div>
    <main>
        <div class="container admin-content">

            <a href="/admin/dashboard" class="back-button" aria-label="Voltar para o painel">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <!-- TÍTULO -->

            <div class="glass-card mb-4">

                <h1 class="page-title">
                    Gestão de Anúncios
                </h1>

                <p class="subtitle">
                    Gerencie campanhas patrocinadas exibidas no TripBrasil.
                </p>

            </div>
            <!-- MÉTRICAS -->

            <div class="row g-4 mb-4">

                <div class="col-md-4">

                    <div class="glass-card metric-card">

                        <div class="metric-number">41</div>

                        <div class="metric-label">
                            Campanhas Ativas
                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="glass-card metric-card">

                        <div class="metric-number">8</div>

                        <div class="metric-label">
                            Pendentes de Aprovação
                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="glass-card metric-card">

                        <div class="metric-number">3</div>

                        <div class="metric-label">
                            Expiradas
                        </div>

                    </div>

                </div>

            </div>

            <!-- FILTROS -->

            <div class="glass-card mb-4">

                <form class="row g-3" method="get" action="/admin/anuncios">

                    <div class="col-md-6">

                        <input type="text" name="q" class="form-control" placeholder="Pesquisar campanha ou anunciante" aria-label="Pesquisar campanha ou anunciante">

                    </div>

                    <div class="col-md-3">

                        <select name="status" class="form-select" aria-label="Filtrar por status">

                            <option value="">Status</option>

                            <option value="ativo">Ativo</option>

                            <option value="pendente">Pendente</option>

                            <option value="expirado">Expirado</option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <select name="categoria" class="form-select" aria-label="Filtrar por categoria">

                            <option value="">Categoria</option>

                            <option value="hospedagem">Hospedagem</option>

                            <option value="restaurante">Restaurante</option>

                            <option value="passeio">Passeio</option>

                            <option value="evento">Evento</option>

                        </select>

                    </div>

                </form>

            </div>

            <div class="glass-card">

                <h2 class="mb-4 h3">
                    Campanhas Contratadas
                </h2>

                <div class="table-responsive">

                    <div class="campaign-list">

                        <div class="campaign-card">

                            <img src="/static/img/anuncio1.jpg" class="campaign-thumb" alt="Campanha do Hotel Costa Azul">

                            <div class="campaign-info">

                                <h3 class="h4">Hotel Costa Azul</h3>

                                <p>
                                    Rede Costa Azul • Hospedagem
                                </p>

                                <span class="status active">
                                    Ativo
                                </span>

                            </div>

                            <div class="campaign-period">

                                <strong>Período</strong>

                                <span>
                                    01/07 - 31/07
                                </span>

                            </div>

                            <div class="campaign-actions">

                                <button class="btn-edit" onclick="window.location.href='/admin/editar-anuncio'">
                                    Editar
                                </button>

                                <button class="btn-delete">
                                    Excluir
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/administrador-admin-anuncios.js"></script>
</body>

</html>
