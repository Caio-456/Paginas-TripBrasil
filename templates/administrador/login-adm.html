<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Login Administrativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/administrador.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-header-admin.css">
  <link rel="stylesheet" href="/static/css/pages/administrador-login-adm.css">
</head>
<body>

    <div id="header"></div>

    <div class="login-wrapper-content">
        <main class="login-container">
            <div class="login-header">
                <div class="admin-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>TripBrasil <span>Admin</span></h1>
                <p>Acesso exclusivo ao painel de gerenciamento e moderação</p>
            </div>

            <form id="formLoginAdmin" method="post" action="/admin/login" onsubmit="handleLogin(event)">

                <div class="input-group">
                    <label for="email">E-mail Corporativo</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" name="email" placeholder="nome@tripbrasil.com" required autocomplete="username" id="email">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Senha Administrativa</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" name="senha" id="password" placeholder="••••••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility()" aria-label="Mostrar ou ocultar a senha">
                            <i class="fa-solid fa-eye" id="passIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Autenticar no Painel
                </button>
            </form>

            <div class="login-footer">
                <a href="/login"><i class="fa-solid fa-arrow-left-long"></i> Voltar para login de usuário comum</a>
            </div>
        </main>
    </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/administrador-login-adm.js"></script>
</body>
</html>
