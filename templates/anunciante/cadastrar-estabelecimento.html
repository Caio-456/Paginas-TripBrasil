<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Cadastrar Estabelecimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/anunciante.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/anunciante-cadastrar-estabelecimento.css">
</head>
<body>

    <div id="header"></div>

    <main class="main-container">
        <a href="/anunciante/area" class="back-button" aria-label="Voltar para a área do anunciante">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
        <h1 class="page-title">Anuncie seu <span>estabelecimento</span> e impulsione seu negócio!</h1>

        <form id="formEstabelecimento" method="post" action="/anunciante/cadastrar-estabelecimento" onsubmit="event.preventDefault(); openModal();">
            <div class="form-grid">

                <div class="column">
                    <section>
                        <h2 class="section-title"><i class="fa-solid fa-circle-info"></i> Informações Básicas</h2>
                        <div class="input-group">
                            <label for="nome">Nome do Estabelecimento</label>
                            <input type="text" name="nome" placeholder="Ex: Pousada Recanto do Sol" required id="nome">
                        </div>
                        <div class="input-group">
                            <label for="descricao">Descrição</label>
                            <textarea name="descricao" placeholder="Conte um pouco sobre o local..." required id="descricao"></textarea>
                        </div>
                    </section>

                    <section style="margin-top: 30px;">
                        <h2 class="section-title"><i class="fa-solid fa-map-location-dot"></i> Localização</h2>
                        <div class="row">
                            <div class="input-group">
                                <label for="select-estado">Estado</label>
                                <select name="estado" id="select-estado" required>
                                    <option value="">Carregando estados...</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="select-cidade">Cidade</label>
                                <select name="cidade" id="select-cidade" required disabled>
                                    <option value="">Selecione um estado antes</option>
                                </select>
                            </div>
                        </div>
                        <label>Marque a localização no mapa:</label>
                        <div class="map-placeholder">
                            <i class="fa-solid fa-map-pin" style="font-size: 30px; margin-bottom: 10px;"></i>
                            O mapa será carregado aqui interativamente
                        </div>
                    </section>
                </div>

                <div class="column">
                    <section>
                        <h2 class="section-title"><i class="fa-solid fa-tags"></i> Detalhes e Mídia</h2>

                        <div class="row" style="align-items: flex-end; margin-bottom: 20px;">
                            <div class="input-group" style="margin-bottom: 0;">
                                <label for="preco">Preço de entrada</label>
                                <input type="number" step="0.01" min="0" name="preco" placeholder="R$ 0,00" id="preco">
                            </div>
                            <div class="checkbox-group" style="padding-bottom: 12px;">
                                <input type="checkbox" name="gratuito" value="1" id="gratuito">
                                <label for="gratuito" style="margin-bottom: 0;">Gratuito</label>
                            </div>
                        </div>

                        <label>Mídia (Fotos)</label>
                        <div class="media-grid">
                            <div class="upload-main">
                                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 40px; margin-bottom: 10px; color: #63b880;"></i>
                                <span style="font-size: 13px;">Adicione a imagem principal</span>
                            </div>
                            <div class="upload-thumb"><i class="fa-regular fa-image"></i></div>
                            <div class="upload-thumb"><i class="fa-regular fa-image"></i></div>
                        </div>
                    </section>
                </div>
            </div>

            <div class="footer-actions">
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus-circle"></i> Cadastrar Estabelecimento
                </button>
            </div>
        </form>
    </main>

    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3>Sucesso!</h3>
            <p>Seu estabelecimento foi enviado para a nossa equipe e estará disponível no TripBrasil em breve.</p>
            <button class="btn-modal-close" onclick="closeModal()">Ótimo</button>
        </div>
    </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/anunciante-cadastrar-estabelecimento.js"></script>
</body>
</html>
