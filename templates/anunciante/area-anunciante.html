<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Área do Anunciante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/anunciante.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/anunciante-area-anunciante.css">
</head>

<body>

    <div id="header"></div>

    <main class="hero">
        <div class="container d-flex justify-content-center">

            <div class="dashboard-card">

                <button class="btn-back" onclick="window.history.back()" title="Voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <h1 class="welcome-title">Bem-vindo à área do anunciante!</h1>

                <div class="row g-4">

                    <div class="col-lg-5 d-flex flex-column justify-content-between">

                        <div class="graph-box">
                            <div class="graph-box-title">
                                <i class="fa-solid fa-chart-simple"></i>
                                <span>Visualizações</span>
                            </div>
                            <div style="position: relative; height: 240px; width: 100%;">
                                <canvas id="viewsChart"></canvas>
                            </div>
                        </div>

                        <div class="action-buttons-gap">
                            <a href="/anunciante/cadastrar-estabelecimento" class="btn-dash-action btn-dash-primary">
                                <i class="fa-solid fa-plus"></i>
                                Cadastrar estabelecimento
                            </a>
                            <a href="/anunciante/contratar-resultado" class="btn-dash-action btn-dash-secondary">
                                <i class="fa-solid fa-arrow-up-right-dots"></i>
                                Contratar resultados
                            </a>
                            <a href="/anunciante/estatisticas-anuncios" class="btn-dash-action btn-dash-secondary">
                                <i class="fa-solid fa-arrow-up-right-dots"></i>
                                Ver estatísticas
                            </a>
                        </div>

                    </div>

                    <div class="col-lg-7">

                        <div class="list-box">
                            <div class="list-box-header">
                                <span>Meus estabelecimentos</span>
                                <i class="fa-solid fa-store"
                                    style="color: rgba(255,255,255,0.4); font-size: 1.2rem;"></i>
                            </div>

                            <div class="list-scroll-area">

                                <!-- repeticao: 4 establishment-item iguais, candidato a {% for %} -->
                                <div class="establishment-item">
                                    <div>
                                        <div class="est-name">Pousada Recanto do Sol</div>
                                        <div class="est-status">Anunciando: <span>Sim</span></div>
                                    </div>
                                    <div class="est-actions">
                                        <button class="btn-action-icon" title="Editar"
                                            onclick="window.location.href='/anunciante/editar-estabelecimento'" aria-label="Editar"><i
                                                class="fa-solid fa-pen"></i></button>
                                        <button class="btn-action-icon delete" title="Excluir" aria-label="Excluir"><i
                                                class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>

                                <div class="establishment-item">
                                    <div>
                                        <div class="est-name">Restaurante Sabor Capixaba</div>
                                        <div class="est-status">Anunciando: <span>Sim</span></div>
                                    </div>
                                    <div class="est-actions">
                                        <button class="btn-action-icon" title="Editar"
                                            onclick="window.location.href='/anunciante/editar-estabelecimento'" aria-label="Editar"><i
                                                class="fa-solid fa-pen"></i></button>
                                        <button class="btn-action-icon delete" title="Excluir" aria-label="Excluir"><i
                                                class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>

                                <div class="establishment-item">
                                    <div>
                                        <div class="est-name">Bistrô das Montanhas</div>
                                        <div class="est-status">Anunciando: <span>Sim</span></div>
                                    </div>
                                    <div class="est-actions">
                                        <button class="btn-action-icon" title="Editar"
                                            onclick="window.location.href='/anunciante/editar-estabelecimento'" aria-label="Editar"><i
                                                class="fa-solid fa-pen"></i></button>
                                        <button class="btn-action-icon delete" title="Excluir" aria-label="Excluir"><i
                                                class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>

                                <div class="establishment-item">
                                    <div>
                                        <div class="est-name">Hotel Marina Blue</div>
                                        <div class="est-status">Anunciando: <span>Sim</span></div>
                                    </div>
                                    <div class="est-actions">
                                        <button class="btn-action-icon" title="Editar"
                                            onclick="window.location.href='/anunciante/editar-estabelecimento'" aria-label="Editar"><i
                                                class="fa-solid fa-pen"></i></button>
                                        <button class="btn-action-icon delete" title="Excluir" aria-label="Excluir"><i
                                                class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/anunciante-area-anunciante.js"></script>
</body>

</html>
