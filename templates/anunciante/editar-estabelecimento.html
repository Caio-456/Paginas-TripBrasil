<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBrasil - Editar Estabelecimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/anunciante.css">
  <link rel="stylesheet" href="/static/css/pages/cadastrado-header-cadastrado.css">
  <link rel="stylesheet" href="/static/css/pages/anunciante-editar-estabelecimento.css">
</head>
<body>

    <div id="header"></div>

    <main class="main-container">
        <a href="/anunciante/area" class="back-button" aria-label="Voltar para a área do anunciante">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
        <h1 class="page-title">Atualize seu <span>estabelecimento</span> no TripBrasil!</h1>

        <form id="formEditar" method="post" action="/anunciante/editar-estabelecimento" onsubmit="event.preventDefault(); openModal();">
            <div class="form-grid">

                <div class="column">
                    <section>
                        <h2 class="section-title"><i class="fa-solid fa-pen-to-square"></i> Informações Básicas</h2>
                        <div class="input-group">
                            <label for="nome">Nome do Estabelecimento</label>
                            <input type="text" name="nome" value="Casa de shows Pitanguinha" required id="nome">
                        </div>
                        <div class="input-group">
                            <label for="descricao">Descrição</label>
                            <textarea name="descricao" required id="descricao">Casa de shows onde fazem shows legais!!!!!</textarea>
                        </div>
                    </section>

                    <section style="margin-top: 30px;">
                        <h2 class="section-title"><i class="fa-solid fa-map-location-dot"></i> Localização</h2>
                        <div class="row">
                            <div class="input-group">
                                <label for="select-estado">Estado</label>
                                <select name="estado" id="select-estado" required>
                                    <option value="">Carregando estados...</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="select-cidade">Cidade</label>
                                <select name="cidade" id="select-cidade" required disabled>
                                    <option value="">Selecione um estado antes</option>
                                </select>
                            </div>
                        </div>
                        <label>Marque a localização no mapa:</label>
                        <div class="map-placeholder">
                            <i class="fa-solid fa-map-pin" style="font-size: 30px; margin-bottom: 10px;"></i>
                            O mapa já está apontando para as coordenadas salvas.
                        </div>
                    </section>
                </div>

                <div class="column">
                    <section>
                        <h2 class="section-title"><i class="fa-solid fa-images"></i> Detalhes e Mídia</h2>

                        <div class="row" style="align-items: flex-end; margin-bottom: 20px;">
                            <div class="input-group" style="margin-bottom: 0;">
                                <label for="preco">Preço de entrada</label>
                                <input type="text" name="preco" inputmode="decimal" value="R$ 50,00" id="preco">
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 12px; font-size: 14px;">
                                <input type="checkbox" name="gratuito" value="1" id="gratuito" style="width: auto;">
                                <label for="gratuito" style="margin-bottom: 0;">Gratuito</label>
                            </div>
                        </div>

                        <label>Mídia (Fotos Atuais)</label>
                        <div class="media-grid">
                            <div class="upload-main">
                                <img src="https://images.unsplash.com/photo-1514525253361-bee8718a34a1?q=80&w=1000&auto=format&fit=crop" alt="Foto atual">
                            </div>
                            <div class="upload-thumb"><i class="fa-solid fa-image" style="color: rgba(255,255,255,0.5)"></i></div>
                            <div class="upload-thumb"><i class="fa-solid fa-plus"></i></div>
                        </div>
                    </section>
                </div>
            </div>

            <div class="footer-actions">
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
                </button>
            </div>
        </form>
    </main>

    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3>Atualizado!</h3>
            <p>As alterações na **Casa de shows Pitanguinha** foram salvas com sucesso e já estão ao vivo.</p>
            <button class="btn-modal-close" onclick="closeModal()">Entendido</button>
        </div>
    </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/pages/anunciante-editar-estabelecimento.js"></script>
</body>
</html>
