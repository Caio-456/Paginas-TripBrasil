<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripBrasil - Home</title>
    <base href="../">

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #70AE6E;
            --primary-hover: #5A9758;
            --glass: rgba(255, 255, 255, .10);
            --glass-border: rgba(255, 255, 255, .18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Red Hat Display', sans-serif;

            color: white;

            background:
                linear-gradient(rgba(0, 0, 0, .55),
                    rgba(0, 0, 0, .55)),
                url('../static/img/fundo.webp');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
        }

        /* HERO */

        .hero {
            min-height: 90vh;

            background:
                linear-gradient(rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)),
                url('../static/img/fundo.webp');

            background-size: cover;
            background-position: center;

            display: flex;
            align-items: center;
        }

        /* HERO CONTENT */

        .hero-content {
            max-width: 700px;

            margin-left: 8%;

            padding-top: 80px;
        }

        .badge {
            display: inline-block;

            padding: 10px 18px;

            margin-bottom: 25px;

            background: rgba(255, 255, 255, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 50px;

            font-size: 0.95rem;
        }

        .hero-content h1 {
            font-family: 'Outfit', sans-serif;

            font-size: clamp(3rem, 7vw, 5.5rem);

            line-height: 1.1;

            margin-bottom: 25px;
        }

        .hero-content p {
            font-size: 1.2rem;

            line-height: 1.7;

            margin-bottom: 40px;

            color: rgba(255, 255, 255, 0.9);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* BOTÕES */

        .btn-primary,
        .btn-secondary {
            text-decoration: none;

            padding: 16px 30px;

            border-radius: 12px;

            font-weight: 600;

            transition: 0.3s;
        }

        .btn-primary {
            background: #113601;
            color: white;
        }

        .btn-primary:hover {
            background: #0d2901;
            transform: translateY(-3px);
        }

        .btn-secondary {
            border: 2px solid white;
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* RESPONSIVO */

        @media (max-width: 900px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero-content {
                margin: 0 30px;
                text-align: center;
            }

            .hero-buttons {
                justify-content: center;
            }
        }

        .explore-section,
        .destinations-section,
        .map-section {

            padding: 90px 20px;

            background: transparent;
        }

        .section-container {

            max-width: 1200px;

            margin: auto;
        }

        /* BUSCA */

        .search-card {

            background: rgba(255, 255, 255, .08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .15);

            border-radius: 32px;

            padding: 50px;
        }

        .search-card h2 {

            font-family: 'Outfit';

            margin-bottom: 30px;
        }

        .search-box {

            display: flex;

            gap: 15px;
        }

        .search-box input {

            flex: 1;

            padding: 18px;

            border-radius: 14px;

            border: 1px solid #D1D5DB;

            font-size: 16px;
        }

        .search-box button {

            background: #113601;

            color: white;

            border: none;

            border-radius: 14px;

            padding: 0 30px;

            cursor: pointer;
        }

        /* FILTROS */

        .filters {

            margin-top: 30px;

            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }

        .filter-chip {

            background: #EDF5EC;

            color: #113601;

            border: none;

            padding: 12px 20px;

            border-radius: 999px;

            cursor: pointer;
        }

        .filter-chip:hover {

            background: var(--primary);

            border-color: var(--primary);

            transform: translateY(-2px);
        }

        /* DESTINOS */

        .destinations-section h2,
        .map-card h2 {

            font-family: 'Outfit';

            margin-bottom: 35px;
        }

        .destinations-grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;
        }

        .destination-card {

            background: white;

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }

        .destination-card:hover {

            transform: translateY(-8px);
        }

        .destination-card img {

            width: 100%;

            height: 220px;

            object-fit: cover;
        }

        .card-content {

            padding: 25px;
        }

        .card-content h3 {

            margin-bottom: 12px;
        }

        /* MAPA */

        .map-card {

            background: white;

            border-radius: 28px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .map-card p {

            color: #6B7280;

            max-width: 700px;

            margin:
                0 auto 40px;
        }

        .map-placeholder {

            padding: 30px;
        }

        .map-placeholder img {

            width: 100%;

            max-width: 700px;
        }

        .stats-section {

            padding: 40px 20px;
        }

        .stats-grid {

            max-width: 1200px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
        }

        .stat-card {

            background: var(--glass);

            backdrop-filter: blur(15px);

            border: 1px solid var(--glass-border);

            border-radius: 24px;

            padding: 30px;

            text-align: center;
        }

        .stat-card h3 {

            color: var(--primary);

            font-size: 2.5rem;

            margin-bottom: 10px;
        }

        .section-header {

            text-align: center;

            margin-bottom: 50px;
        }

        .section-header span {

            color: var(--primary);

            font-weight: 700;

            font-family: 'Outfit', sans-serif;

            font-size: 1.2rem;

            text-transform: uppercase;

            letter-spacing: 2px;
        }

        .section-header h2 {

            font-family: 'Outfit', sans-serif;

            font-size: 2.8rem;

            margin-top: 10px;
        }

        .section-header p {

            max-width: 700px;

            margin: 20px auto 0;

            color: rgba(255, 255, 255, .75);
        }

        /* HEADER */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            color: white;
        }

        header {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            width: 95%;
            max-width: 1400px;

            padding: 15px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            z-index: 1000;
        }

        .logo {
            height: 50px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;

            font-weight: 500;

            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.75;
        }

        .btn-nav {
            background: #70AE6E;

            padding: 12px 24px;

            border-radius: 10px;
        }
    </style>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>TripBrasil</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Red+Hat+Display:wght@400;500;700&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>

<body>


    <header>
        <a href="publico/home.html">
            <img src="static/img/logo-cabecario.svg" alt="Logo TripBrasil" class="logo">
        </a>

        <nav>
            <a href="publico/buscar-explorar.html">Explorar</a>
            <a href="publico/tornar-se-anunciante.html">Tornar-se anunciante</a>
            <a href="publico/login.html">Entrar</a>

            <a href="publico/cadastro.html" class="btn-nav">
                Cadastro
            </a>
        </nav>
    </header>

    </section>

    {% block content %}{% endblock %}
</body>

</html>
